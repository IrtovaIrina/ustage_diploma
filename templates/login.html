<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация сотрудника — USTAGE GROUP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin:0; padding:0; background:#F4F6F9; font-family:'Open Sans',sans-serif; color:#22252A; }
        .login-wrap { max-width:460px; margin:70px auto; padding:0 20px; }
        .card { background:#fff; border:1px solid #DDE2EC; border-top:4px solid #0066CC; border-radius:3px; padding:30px; box-shadow:0 3px 10px rgba(0,0,0,0.06); }
        h1 { font-family:'Montserrat',sans-serif; font-size:21px; margin:0 0 6px 0; text-transform:uppercase; }
        h1 span { color:#0066CC; }
        label { display:block; font-size:12px; font-weight:600; margin-top:14px; }
        input { width:100%; padding:10px 12px; border:1px solid #C5CEDB; border-radius:2px; margin-top:4px; font-size:13.5px; box-sizing:border-box; }
        .btn { width:100%; margin-top:20px; background:#0066CC; color:#fff; border:none; padding:12px; font-family:'Montserrat',sans-serif; font-weight:700; text-transform:uppercase; cursor:pointer; border-radius:2px; }
        .btn:hover { background:#0052A3; }
        .msg { background:#FDE8E8; color:#C53030; border-left:4px solid #DC3545; padding:10px; margin-bottom:12px; font-size:12.5px; font-weight:600; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="card">
            <h1>USTAGE <span>GROUP</span></h1>
            <div style="font-size:12px; color:#6C757D; margin-bottom:16px;">
                Вход в корпоративную информационную систему ООО «Юстейдж»
            </div>

            {% if messages %}
                {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <label>Корпоративная электронная почта сотрудника:</label>
                <input type="email" name="email" placeholder="Введите корпоративную почту (@ustage-group.ru)" required autofocus>

                <label>Пароль:</label>
                <input type="password" name="password" placeholder="Введите пароль" required>

                <button type="submit" class="btn">Войти в систему →</button>
            </form>

            <div style="margin-top:16px; text-align:center;">
                <a href="{% url 'forgot_password' %}" style="color:#0066CC; font-size:12.5px; font-weight:600; text-decoration:none;">
                    Забыли пароль? Восстановить через корпоративную почту
                </a>
            </div>
        </div>
    </div>
</body>
</html>
